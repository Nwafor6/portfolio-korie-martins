{% block content %}           
    <div class="row tm-row">
        <div class="col-12">
            <hr class="tm-hr-primary tm-mb-55">
            <!-- Video player 1422x800 -->

                <img src="{{project.cover_image}}" alt="Image" class="mb-3 img-fluid">

            </figure>
        </div>
    </div>
    <div class="row tm-row">
        <div class="col-lg-12 tm-post-col">
            <div class="tm-post-full">

                    <h2 class="pt-2 tm-color-primary tm-post-title">{{project.title}}</h2>
                    <p class="tm-mb-40">{{project.created_at}}</p>
                    <div>
                        {{project.content|safe}}
                    </div>
                </div>
                
            </div>
        </div>

{% block scripts %}
    <script src="{% static 'js/jquery.min.js' %}"></script>
    <script src="{% static 'js/templatemo-script.js' %}"></script>
    <script>
        // Add the 'img-fluid' class to all images inside the project content
        document.addEventListener("DOMContentLoaded", function () {
            const contentImages = document.querySelectorAll(".tm-post-full img");
            contentImages.forEach((img) => {
                img.classList.add("img-fluid");
            });
        });
    </script>
{% endblock %}
